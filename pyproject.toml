[project]
name = "parallax-quant"
version = "0.2.0"
description = "Parallax Quant: multi-strategy crypto arbitrage research and paper-trading engine with a local research console"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "ccxt>=4.3.0",
    "web3>=6.19.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "aio-pika>=9.4.1",
    "prometheus-client>=0.20.0",
    "ntplib>=0.4.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
]

[project.scripts]
parallax = "parallax_quant.main:main"
parallax-console = "parallax_quant.dashboard.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.8",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.25",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"parallax_quant.dashboard" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=parallax_quant --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
