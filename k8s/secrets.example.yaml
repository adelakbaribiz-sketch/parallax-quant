# Copy to secrets.yaml, fill in real values, and NEVER commit secrets.yaml.
# Apply with: kubectl apply -f k8s/secrets.yaml
# Better: use Vault/External Secrets Operator/Sealed Secrets in any real
# deployment instead of a plain Kubernetes Secret (which is only
# base64-encoded, not encrypted, at rest by default).
apiVersion: v1
kind: Secret
metadata:
  name: arbitragex-secrets
  namespace: arbitragex
type: Opaque
stringData:
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  OKX_API_KEY: ""
  OKX_API_SECRET: ""
  KRAKEN_API_KEY: ""
  KRAKEN_API_SECRET: ""
  ETHEREUM_RPC_URL: ""
  EXECUTION_WALLET_PRIVATE_KEY: ""
  FLASH_ARB_CONTRACT_ADDRESS: ""
  TIMESCALEDB_DSN: "postgresql://arbx:CHANGE_ME@timescaledb:5432/arbx"
  POSTGRES_DSN: "postgresql://arbx:CHANGE_ME@timescaledb:5432/arbx"
  REDIS_URL: "redis://redis:6379/0"
  RABBITMQ_URL: "amqp://arbx:CHANGE_ME@rabbitmq:5672/"
  AML_KYC_API_KEY: ""
  # Deliberately NOT included here: ARBITRAGEX_ENABLE_LIVE_TRADING.
  # That confirmation variable should be set manually / via a separate,
  # more tightly access-controlled mechanism than the general secrets
  # bundle — see docs/COMPLIANCE.md and config.py's is_live_trading_authorized.
