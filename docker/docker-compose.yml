name: parallax-quant

services:
  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      TIMESCALEDB_DSN: postgresql://arbx:arbx@timescaledb:5432/arbx
      POSTGRES_DSN: postgresql://arbx:arbx@timescaledb:5432/arbx
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://arbx:arbx@rabbitmq:5672/
    ports:
      - "9100:9100"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../config:/app/config:ro
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.15.2-pg16
    environment:
      POSTGRES_USER: arbx
      POSTGRES_PASSWORD: arbx
      POSTGRES_DB: arbx
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: arbx
      RABBITMQ_DEFAULT_PASS: arbx
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  timescale_data:
  grafana_data:
